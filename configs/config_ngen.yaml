
general:
  # ------ fields overridding config_general.yaml; otherwise inherited from config_general.yaml -----
  # run_name: test  # Name of the run, used to create output folders and files
  # domain: conus  # Define NWM domain. Supported options: conus, ak, hi, prvi
  # vpu_list: ['03S'] # List of VPUs to process.
  # n_procs: -1  # Number of processors to use; set to -1 to use all available processors 
  # base_dir: '${WORKSPACE_ROOT}/run_region' # Path to the base directory, with WORKSPACE_ROOT set via docker run (/ngen-dev/$USER on INT, /ngen-oe/$USER on OE, ~ on local AWS workspace)
  # static_data_dir: '/ngencerf-app/nwm-region-mgr/data/inputs'  # Path to the static data directory   
  # ngen_hydrofabric_file: '{static_data_dir}/hydrofabric/gpkg_vpu/vpu_{vpu_list}.gpkg'  

  # ----- fields unique to NGEN simulation (i.e., not in config_general.yaml) ----
  start_time: '2022-10-01T00:00:00'
  end_time: '2022-10-01T10:00:00'
  algorithm_list: ['kmeans']  # list of algorithms to use for parameter regionalization
  par_file: '{base_dir}/outputs/region/{run_name}/params/formulation_params_{algorithm_list}_conus_vpu{vpu_list}.csv'
  pair_file: '{base_dir}/outputs/region/{run_name}/pairs/pairs_{algorithm_list}_conus_vpu{vpu_list}_mswm.csv'
  config_template: '{static_data_dir}/ngen/mswm.config.template.docker'

output:
  ngen:
    save: true
    path: '{base_dir}/outputs/ngen/' # only accepts the root directory for NGEN simulation inputs/outputs (with sub-folders created by MSWM as needed)
  config_final:
    save: true
    path: '{base_dir}/outputs/ngen/{run_name}/config_ngen_final.yaml'