### general 
general:
  run_name: 'run_ngen_hlr'
  domain: 'conus'
  vpu_list: ['01']
  n_procs: 3
  attr_dataset_list: ['ngen', 'hlr']
  algorithm_list: ["gower","urf","kmeans","kmedoids",'hdbscan',"birch"]
  base_dir: '/home/matthew.deshotel/repos/ngen-regionalization/data/ngen_reg'
  hydrofabric_file: '{base_dir}/hydrofabric/vpu_divides/vpu_{vpu_list}.gpkg'  
  id_name: 'divide_id'

donor:
  id_name: 'gage_id'
  donor_gage_file: '{base_dir}/gages_nwm4_calib_all.csv'
  donor_ngen_cwt_file: '{base_dir}/cwt_ngen_donor/calib_gage_divide_{domain}.parquet'
  donor_stats_file:  '{base_dir}/donor_stats/stats_calib_valid_{domain}.csv'
  buffer_km: 200
  metric_eval_period:
    col_name: 'evalPeriod'
    value: 'full'
  metric_threshold:
    corr:
      min: 0.4
    kge: 
      min: 0.2
    nse:
      min: 0.2
    bias:
      max: 60
      absolute: TRUE

attr_datasets:
  ngen:
    attr_list: 
    attr_select_file: '{base_dir}/config/attr_selection_ngen.csv'
    attr_data_file: '{base_dir}/attr_datasets/attr_ngen_{domain}.parquet'
  hlr:
    attr_list:
    attr_select_file: '{base_dir}/config/attr_selection_hlr.csv'
    attr_data_file: '{base_dir}/attr_datasets/attr_hlr_{domain}.parquet'

output:
